services:
  postgres:
    image: postgres:16
    container_name: campusslot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusslot
      POSTGRES_USER: campusslot
      POSTGRES_PASSWORD: campusslot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - campusslot_pgdata:/var/lib/postgresql/data

volumes:
  campusslot_pgdata:
