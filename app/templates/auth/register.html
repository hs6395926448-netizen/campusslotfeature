{% extends 'base.html' %}
{% block title %}Teacher Registration — CampusSlot{% endblock %}
{% block content %}<div class="container py-4"><div class="row justify-content-center"><div class="col-lg-8"><div class="text-center mb-4"><span class="badge text-bg-primary">Teacher Signup</span><h2 class="fw-bold mt-2">Create your faculty account</h2><p class="text-muted">Your account will become active after administrator approval.</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4 p-lg-5"><form method="POST"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full Name *</label><input class="form-control" name="name" value="{{ name or '' }}" required></div><div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" value="{{ email or '' }}" required></div><div class="col-md-6"><label class="form-label">Phone *</label><input class="form-control" name="phone" value="{{ phone or '' }}" required></div><div class="col-md-6"><label class="form-label">Department *</label><input class="form-control" name="department" value="{{ department or '' }}" placeholder="Computer Science" required></div><div class="col-md-6"><label class="form-label">Designation</label><input class="form-control" name="designation" value="{{ designation or '' }}" placeholder="Assistant Professor"></div><div class="col-md-6"><label class="form-label">Subject / Specialization</label><input class="form-control" name="subject" value="{{ subject or '' }}" placeholder="Data Structures"></div><div class="col-md-6"><label class="form-label">Office / Room</label><input class="form-control" name="office" value="{{ office or '' }}"></div><div class="col-md-6"><label class="form-label">Campus / Address</label><input class="form-control" name="address" value="{{ address or '' }}"></div><div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" name="description" rows="3">{{ description or '' }}</textarea></div><div class="col-md-6"><label class="form-label">Password *</label><input class="form-control" type="password" name="password" required></div><div class="col-md-6"><label class="form-label">Confirm Password *</label><input class="form-control" type="password" name="confirm_password" required></div></div><button class="btn btn-primary btn-lg w-100 mt-4">Submit Registration Request</button></form></div></div><p class="text-center mt-3">Already approved? <a href="/login">Teacher Login</a></p></div></div></div>{% endblock %}
