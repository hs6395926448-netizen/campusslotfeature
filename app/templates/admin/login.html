{% extends "base.html" %}
{% block title %}Administrator Login — CampusSlot{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow-sm border-0"><div class="card-body p-4">
<h3 class="fw-bold mb-1"><i class="bi bi-shield-lock me-2"></i>Administrator Login</h3>
<p class="text-muted mb-4">Only administrators can create student, teacher and administrator accounts.</p>
<form method="post">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{ email or '' }}" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
<button class="btn btn-dark w-100">Login as Administrator</button>
</form></div></div></div></div></div>
{% endblock %}
