{% extends 'base.html' %}
{% block title %}Student Login — CampusSlot{% endblock %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="text-center mb-4"><div class="avatar avatar-lg mx-auto"><i class="bi bi-mortarboard"></i></div><h2 class="fw-bold mt-3">Student Login</h2><p class="text-muted">Book and track faculty appointments</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="POST"><label class="form-label">College Email</label><input class="form-control mb-3" type="email" name="email" value="{{ email or '' }}" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Keep me logged in</label></div><button class="btn btn-primary w-100 btn-lg">Log In</button></form></div></div><p class="text-center mt-3">New student? <a href="/student/register">Create account</a></p><p class="text-center small"><a href="/login">Teacher Login</a> · <a href="/admin/login">Admin Login</a></p></div></div></div>{% endblock %}
