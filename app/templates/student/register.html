{% extends 'base.html' %}
{% block title %}Student Registration — CampusSlot{% endblock %}
{% block content %}<div class="container py-4"><div class="row justify-content-center"><div class="col-lg-8"><div class="text-center mb-4"><span class="badge text-bg-primary">Student Signup</span><h2 class="fw-bold mt-2">Create your student account</h2><p class="text-muted">Your account will become active after administrator approval.</p></div><div class="card border-0 shadow-sm"><div class="card-body p-4 p-lg-5"><form method="POST"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full Name *</label><input class="form-control" name="name" value="{{ name or '' }}" required></div><div class="col-md-6"><label class="form-label">Roll Number *</label><input class="form-control" name="roll_number" value="{{ roll_number or '' }}" required></div><div class="col-md-6"><label class="form-label">College Email *</label><input class="form-control" type="email" name="email" value="{{ email or '' }}" required></div><div class="col-md-6"><label class="form-label">Phone *</label><input class="form-control" name="phone" value="{{ phone or '' }}" required></div><div class="col-md-6"><label class="form-label">Department *</label><input class="form-control" name="department" value="{{ department or '' }}" placeholder="CSE" required></div><div class="col-md-6"><label class="form-label">Course</label><input class="form-control" name="course" value="{{ course or '' }}"></div><div class="col-md-6"><label class="form-label">Semester</label><input class="form-control" type="number" min="1" max="12" name="semester" value="{{ semester or '' }}"></div><div class="col-md-6"><label class="form-label">Password *</label><input class="form-control" type="password" name="password" required></div><div class="col-md-6"><label class="form-label">Confirm Password *</label><input class="form-control" type="password" name="confirm_password" required></div></div><button class="btn btn-primary btn-lg w-100 mt-4">Submit Registration Request</button></form></div></div><p class="text-center mt-3">Already approved? <a href="/student/login">Student Login</a></p></div></div></div>{% endblock %}
